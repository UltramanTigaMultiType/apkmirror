<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源导航站</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  }
  [data-theme="dark"] {
    --bg: #0f1115;
    --card: #171a21;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --border: #2a2f3a;
    --accent: #60a5fa;
    --accent-soft: #1e293b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

  .header { margin-bottom: 18px; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
  .muted { color: var(--muted); }
  .header p { margin: 0; font-size: 14px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px; flex: none;
  }
  .icon-btn:hover { border-color: var(--accent); }

  .search-row { display: flex; gap: 10px; margin-top: 16px; }
  #search {
    flex: 1; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--card); color: var(--text);
    font-size: 15px; outline: none;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ghost-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--muted);
    padding: 0 14px; border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; transition: .15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .tag-bar { font-size: 14px; margin-bottom: 12px; color: var(--muted); }
  .link-btn {
    border: none; background: none; padding: 0; color: var(--accent);
    text-decoration: underline; cursor: pointer; font-size: 14px;
  }
  .count { font-size: 13px; margin: 0 0 12px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }

  .cover {
    position: relative; height: 150px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .cover img { 
  width: 100%; 
  height: 100%; 
  object-fit: contain;
  padding: 24px;
  display: block; 
}
  .cover-placeholder { background: linear-gradient(135deg, var(--accent-soft), var(--border)); }
  .cover-placeholder span { font-size: 34px; font-weight: 700; color: var(--accent); opacity: .65; }
  .badge {
    position: absolute; top: 10px; left: 10px; background: var(--accent); color: #fff;
    font-size: 12px; padding: 2px 8px; border-radius: 6px;
  }

  .body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-size: 16px; margin: 0; line-height: 1.4; }
  .desc {
    font-size: 13px; color: var(--muted); margin: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    border: none; background: var(--accent-soft); color: var(--accent);
    font-size: 12px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
  }
  .tag:hover { filter: brightness(.95); }

  .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
  .btn {
    flex: 1; text-align: center; text-decoration: none; padding: 8px 10px;
    border-radius: 8px; font-size: 14px; border: 1px solid var(--border);
    color: var(--text); transition: .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .footer { margin-top: 40px; font-size: 13px; text-align: center; }

  @media (max-width: 560px) {
    .wrap { padding: 20px 14px 40px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    .cover { height: 140px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="header-top">
      <div>
        <h1 id="siteTitle">资源导航站</h1>
        <p id="siteDesc" class="muted">整理互联网上好用的软件</p>
      </div>
      <button id="themeBtn" class="icon-btn" title="切换主题" aria-label="切换主题">🌓</button>
    </div>
    <div class="search-row">
      <input id="search" type="search" placeholder="搜索标题、描述、标签…" autocomplete="off">
      <button id="clearBtn" class="ghost-btn" hidden>清除筛选</button>
    </div>
  </header>

  <nav id="cats" class="chips" aria-label="分类"></nav>

  <div id="tagBar" class="tag-bar" hidden>
    当前标签：<strong id="tagLabel"></strong>
    <button id="clearTag" class="link-btn">移除</button>
  </div>

  <main>
    <p id="count" class="muted count"></p>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>没有找到匹配的资源</div>
    <div id="loading" class="empty">加载中…</div>
    <div id="error" class="empty" hidden></div>
  </main>

  <footer class="footer muted">
    <span id="footerInfo"></span>
  </footer>
</div>

<script>
// 图片加载失败时替换为首字母占位
function __imgError(img) {
  const wrap = img.parentNode;
  wrap.classList.add('cover-placeholder');
  const span = document.createElement('span');
  span.textContent = img.alt ? img.alt.slice(0, 1) : '?';
  wrap.replaceChild(span, img);
}

const $ = id => document.getElementById(id);
const state = { q: '', category: '', tag: '' };
let DATA = null;

// ---------- 主题 ----------
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) { document.documentElement.dataset.theme = saved; return; }
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
$('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
});

// ---------- 工具 ----------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function resolveCover(cover) {
  if (!cover) return '';
  if (/^(https?:)?\/\//i.test(cover)) return cover;
  return (DATA.assetBase || '') + cover;
}

// ---------- 数据加载 ----------
async function init() {
  try {
    const res = await fetch('data/resources.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    $('loading').hidden = true;

    if (DATA.title) { $('siteTitle').textContent = DATA.title; document.title = DATA.title; }
    if (DATA.description) $('siteDesc').textContent = DATA.description;
    $('footerInfo').textContent = DATA.footer || (DATA.updatedAt ? `更新于 ${DATA.updatedAt}` : '');

    setupCats();
    readHash();
    bindEvents();
    render();
  } catch (e) {
    $('loading').hidden = true;
    $('error').hidden = false;
    $('error').textContent = '数据加载失败：' + e.message + '（请确认 data/resources.json 存在）';
  }
}

// ---------- 分类按钮 ----------
function setupCats() {
  const cats = ['全部', ...(DATA.categories || [])];
  const extra = [...new Set((DATA.resources || []).map(r => r.category).filter(Boolean))]
    .filter(c => !cats.includes(c));
  cats.push(...extra);

  const nav = $('cats');
  nav.innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.cat = c === '全部' ? '' : c;
    b.textContent = c;
    b.addEventListener('click', () => { state.category = b.dataset.cat; render(); });
    nav.appendChild(b);
  });
}

// ---------- URL 状态 ----------
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.q = p.get('q') || '';
  state.category = p.get('cat') || '';
  state.tag = p.get('tag') || '';
  $('search').value = state.q;
}

function syncHash() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.category) p.set('cat', state.category);
  if (state.tag) p.set('tag', state.tag);
  const s = p.toString();
  history.replaceState(null, '', s ? '#' + s : location.pathname + location.search);
}

// ---------- 事件 ----------
let searchTimer;
function bindEvents() {
  $('search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.q = e.target.value.trim();
      render();
    }, 150);
  });

  $('clearTag').addEventListener('click', () => { state.tag = ''; render(); });

  $('clearBtn').addEventListener('click', () => {
    state.q = ''; state.category = ''; state.tag = '';
    $('search').value = '';
    render();
  });
}

// ---------- 渲染 ----------
function render() {
  if (!DATA) return;
  syncHash();

  document.querySelectorAll('#cats .chip').forEach(b => {
    b.classList.toggle('active', (b.dataset.cat || '') === state.category);
  });

  const tagBar = $('tagBar');
  tagBar.hidden = !state.tag;
  if (state.tag) $('tagLabel').textContent = state.tag;

  $('clearBtn').hidden = !(state.q || state.category || state.tag);

  const q = state.q.toLowerCase();
  const list = (DATA.resources || []).filter(r => {
    if (state.category && r.category !== state.category) return false;
    if (state.tag && !(r.tags || []).includes(state.tag)) return false;
    if (q) {
      const hay = [r.title, r.description, r.category, ...(r.tags || [])]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    const fa = a.featured ? 1 : 0;
    const fb = b.featured ? 1 : 0;
    if (fa !== fb) return fb - fa;
    return String(b.addedAt || '').localeCompare(String(a.addedAt || ''));
  });

  const grid = $('grid');
  grid.innerHTML = '';
  list.forEach(r => grid.appendChild(card(r)));

  const total = (DATA.resources || []).length;
  $('count').textContent = `共 ${list.length} 条` + (list.length !== total ? ` / 全部 ${total} 条` : '');
  $('empty').hidden = list.length > 0;
}

function card(r) {
  const el = document.createElement('article');
  el.className = 'card';

  const cover = resolveCover(r.cover);
  const tags = (r.tags || []).map(t =>
    `<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`
  ).join('');

  el.innerHTML = `
    <div class="cover ${cover ? '' : 'cover-placeholder'}">
      ${cover
        ? `<img src="${esc(cover)}" alt="${esc(r.title)}" loading="lazy" onerror="__imgError(this)">`
        : `<span>${esc((r.title || '?').slice(0, 1))}</span>`}
      ${r.featured ? '<span class="badge">精选</span>' : ''}
    </div>
    <div class="body">
      <h3 class="title">${esc(r.title)}</h3>
      ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      <div class="actions">
        <a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">访问</a>
        ${r.download ? `<a class="btn" href="${esc(r.download)}" target="_blank" rel="noopener noreferrer">下载</a>` : ''}
      </div>
    </div>
  `;

  el.querySelectorAll('.tag').forEach(b => {
    b.addEventListener('click', () => { state.tag = b.dataset.tag; render(); });
  });

  return el;
}

init();
</script>
</body>
</html>
